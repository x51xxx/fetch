[package]
name = "fetch"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Node-API level is the addon's ABI floor, which is a separate thing from
# the supported-Node floor in package.json's `engines` (>=24). It stays at 9
# deliberately: nothing here uses a Node-API 10 entry point, so raising it would
# only narrow which runtimes can load the binary while buying nothing. Node 24
# offers Node-API 10 and loads a napi9 addon fine.
napi = { version = "3", default-features = false, features = ["napi9", "async", "tokio_rt", "serde-json"] }
napi-derive = "3"
# `zstd` is not optional despite nothing here calling it directly: with
# wreq-util's `emulation-compression` on (below), a modern Chrome/Firefox/Edge
# profile advertises `zstd` because the real browser does, and advertising an
# encoding we cannot decode is how you get a body that only fails in production.
# It costs no new native dependency -- wreq-util's default `emulation` feature
# already builds zstd-sys.
wreq = { version = "6.0.0-rc.29", features = ["json", "cookies", "gzip", "brotli", "deflate", "zstd", "charset", "socks", "stream"] }
# `emulation-compression` is what makes each profile send its *own*
# `Accept-Encoding` (Chrome's "gzip, deflate, br, zstd", okhttp's bare "gzip",
# ...) in its own position in the header order. Without it wreq-util omits the
# header entirely and tower-http appends a synthesised one derived from whichever
# wreq features happen to be enabled -- "gzip,deflate,br", no spaces, last in the
# list. That is a fingerprint tell no `impersonate` value can hide, and it also
# couples the wire header to our decoder feature flags, which is exactly the
# coupling `no_deflate()` in `build_client` must not have.
wreq-util = { version = "3.0.0-rc.14", features = ["emulation-serde", "emulation-compression"] }
serde_json = "1"
futures-util = "0.3"
# Streaming response bodies (see docs/streaming-design.md). `bytes` and `tokio`
# are pulled in transitively by wreq/napi, but the crate names are not usable
# until declared here -- naming `bytes::Bytes` or `tokio::select!` without these
# fails with E0433.
bytes = "1"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
# `Content-Encoding: deflate` is decoded here rather than by wreq: wreq (via
# tower-http) only accepts the zlib-wrapped form (RFC 1950), while a large slice
# of the web sends raw DEFLATE (RFC 1951) under that same token and browsers
# accept both. See `deflate_body_stream`. Same version tower-http already pulls
# in, so this adds no second copy of the codec.
async-compression = { version = "0.4.42", default-features = false, features = ["tokio", "zlib", "deflate"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
rcgen = "0.13.2"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = true
strip = "symbols"
